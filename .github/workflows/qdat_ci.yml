name: qdat_ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qdat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: verif syntaxe
        run: python -m compileall -q .

      - name: unittest
        run: python -m unittest discover -s . -p "test_*.py" -v

  rapport:
    name: rapport json
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: lance le job
        run: python qdat_job.py
        env:
          SECRET_API_KEY: ${{ secrets.SECRET_API_KEY }}

      - name: garde le rapport
        uses: actions/upload-artifact@v4
        with:
          name: qdat-rapport-${{ github.run_number }}
          path: rapport.json
          if-no-files-found: error

  deploiement:
    name: deploy serveur
    runs-on: ubuntu-latest
    needs: [tests, rapport]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}

      - name: copie les fichiers dans ~/QDat
        run: |
          set -euo pipefail
          sshpass -e ssh "$SSH_USER@$SSH_HOST" 'mkdir -p ~/QDat'
          sshpass -e scp qdat_metrics.py qdat_job.py test_qdat_metrics.py \
            "$SSH_USER@$SSH_HOST:~/QDat/"
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}

      - name: on relance les tests sur le serveur pour verifier
        run: |
          set -euo pipefail
          sshpass -e ssh "$SSH_USER@$SSH_HOST" \
            'cd ~/QDat && python3 -m unittest discover -s . -p "test_qdat_*.py" -v'
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}

      - run: echo "deploy ok sur ${{ vars.SSH_HOST }} ($GITHUB_SHA)"
